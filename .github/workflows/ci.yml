name: Security library checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, redis, curl, session, pdo_sqlite, pdo_mysql, intl, pcntl, posix
          tools: composer
          coverage: none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y redis-server mysql-server
      - run: composer validate --strict && composer install --no-interaction --no-progress
      - run: bin/check.sh php
        env:
          SOSECURITY_REQUIRE_REDIS: '1'
          SOSECURITY_REQUIRE_HTTP: '1'
          SOSECURITY_REQUIRE_RESET: '1'
          SOSECURITY_REQUIRE_MYSQL: '1'
          SOSECURITY_REQUIRE_UPLOAD: '1'
          SOSECURITY_REQUIRE_POSIX: '1'
      - run: bin/full-disk-check.sh php
      - run: python3 tests/install.py php "$(command -v composer)"
      - run: python3 tests/archive.py php "$(command -v composer)"
      - name: Runtime dependency audit
        run: |
          if php -r '$lock = json_decode(file_get_contents("composer.lock"), true); exit(is_array($lock) && isset($lock["packages"], $lock["packages-dev"]) && $lock["packages"] === [] && $lock["packages-dev"] === [] ? 0 : 1);'; then
            echo 'NOT APPLICABLE Composer runtime audit: no third-party packages in lock file'
          else
            composer audit --locked
          fi
  analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.1'
          extensions: redis, gd, curl
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict --working-dir=tools && composer install --working-dir=tools --no-interaction --no-progress
      - run: php tools/vendor/bin/phpstan analyse -c phpstan.neon --no-progress
      - run: composer audit --working-dir=tools --locked
